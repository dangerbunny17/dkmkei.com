<form class="form" action="https://formspree.io/f/{{ site.data.site.formspree_id }}" method="POST" data-form data-live="{% if site.data.site.formspree_id != "" %}true{% else %}false{% endif %}" data-email="{{ site.data.site.email }}">
 <label class="field"><span>Name</span><input id="c-name" type="text" name="name" autocomplete="name" required></label>
 <label class="field"><span>Company</span><input id="c-company" type="text" name="company" autocomplete="organization"></label>
 <label class="field"><span>Email</span><input id="c-email" type="email" name="email" autocomplete="email" required></label>
 <label class="field"><span>Phone <span class="optional">(optional)</span></span><input id="c-phone" type="tel" name="phone" autocomplete="tel"></label>
 <label class="field field-wide"><span>Project type</span>
  <select id="c-project_type" name="project_type" required>
   {% include project-type-options.html %}
  </select>
 </label>
 <label class="field field-wide"><span>Project location <span class="optional">(optional)</span></span><input id="c-project_location" type="text" name="project_location"></label>
 <label class="field field-wide"><span>Project details</span><textarea id="c-message" name="message" rows="6" required></textarea></label>
 <input id="c-subject" type="hidden" name="subject" value="Website inquiry">
 <input id="c-gotcha" type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
 <div class="field-wide form-actions">
  <button class="btn" type="submit">Send message</button>
 </div>
 <p class="form-status field-wide" data-status role="status" aria-live="polite"></p>
</form>
