- title: "Design and specification review"
  text: "We check BMS drawings, points lists and specifications before they go to bid."
  image: "assets/img/card-design.jpg"
  image_position: "70% 30%"
- title: "Controls integration"
  text: "We connect equipment from different vendors over BACnet, Modbus and SNMP into one system."
  image: "assets/img/card-controls.jpg"
  image_position: "50% 50%"
- title: "Owner's representation"
  text: "We review submittals and site work for the owner, so the delivered system matches the design."
  image: "assets/img/card-owners.jpg"
  image_position: "40% 40%"
- title: "Sequences of operation"
  text: "We write and test control sequences for cooling plants, air handling and liquid cooling loops."
  image: "assets/img/card-sequences.jpg"
  image_position: "50% 50%"
- title: "Commissioning support"
  text: "We run point-to-point checks and functional tests, and we document the results."
  image: "assets/img/card-commissioning.jpg"
  image_position: "55% 35%"
- title: "Alarms and graphics"
  text: "We set alarm priorities and operator screens that show problems clearly and early."
  image: "assets/img/card-alarms.jpg"
  image_position: "50% 50%"
