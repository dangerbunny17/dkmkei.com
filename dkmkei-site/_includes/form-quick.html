<form class="form form-quick" action="https://formspree.io/f/{{ site.data.site.formspree_id }}" method="POST" data-form data-live="{% if site.data.site.formspree_id != "" %}true{% else %}false{% endif %}" data-email="{{ site.data.site.email }}">
 <label class="field"><span>Name</span><input id="q-name" type="text" name="name" autocomplete="name" required></label>
 <label class="field"><span>Email</span><input id="q-email" type="email" name="email" autocomplete="email" required></label>
 <label class="field field-wide"><span>Project type</span>
  <select id="q-project_type" name="project_type" required>
   {% include project-type-options.html %}
  </select>
 </label>
 <label class="field field-wide"><span>Project details</span><textarea id="q-message" name="message" rows="4" required></textarea></label>
 <input id="q-subject" type="hidden" name="subject" value="Website inquiry">
 <input id="q-gotcha" type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
 <div class="field-wide form-actions">
  <button class="btn" type="submit">Send message</button>
  <a href="contact.html">More options on the contact page</a>
 </div>
 <p class="form-status field-wide" data-status role="status" aria-live="polite"></p>
</form>
